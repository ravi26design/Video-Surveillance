<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Eye — Surveillance & AI Detection Portal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9;--panel:#ffffff;--panel2:#f7f9fc;--panel3:#e9eef5;--line:#dde3ec;--line2:#c2cbd8;
  --tx:#0f1a2b;--mut:#455468;--dim:#5f6f84;
  --blue:#2563eb;--blue-t:#1d4ed8;--blue-bg:rgba(37,99,235,.10);
  --green:#047857;--green-bg:rgba(4,120,87,.10);
  --red:#dc2626;--red-t:#b91c1c;--red-bg:rgba(220,38,38,.09);
  --orange:#b45309;--orange-bg:rgba(217,119,6,.12);
  --yellow:#854d0e;--yellow-bg:rgba(234,179,8,.18);
  --gray:#64748b;--gray-bg:rgba(100,116,139,.12);
  --map:#eef2f7;--mapgrid:#dde4ee;--zone:#ffffff;--zoneline:#b9c5d6;--road:#d5dce8;
  --r:8px;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue-t);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.sr{position:absolute;left:-9999px}
/* shell */
#app{display:grid;grid-template-columns:232px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 16px;font-weight:700;font-size:15px;letter-spacing:.2px}
.brand .lg{color:#fff;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:11px;letter-spacing:.8px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:500;margin-bottom:2px;position:relative}
nav a:hover{background:var(--panel2);color:var(--tx)}
nav a.on{background:var(--blue-bg);color:var(--blue-t);font-weight:600}
nav a.on:before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--blue)}
nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
nav .sec{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--dim);padding:16px 12px 8px;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:16px}
.me{display:flex;gap:10px;align-items:center;padding:0 8px}
.av{width:32px;height:32px;border-radius:50%;background:var(--panel3);display:grid;place-items:center;font-weight:600;font-size:12px;border:1px solid var(--line2);flex:none}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header.top h1{font-size:16px;font-weight:600}
.search{flex:1;max-width:460px;margin-left:16px;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;color:var(--mut);text-align:left}
.search kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 6px}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center}
.iconbtn:hover{background:var(--panel3)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;border:2px solid var(--panel)}
select.jump{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;max-width:190px}
#content{flex:1;overflow:auto;padding:24px}
.sys{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
/* primitives */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.card>.hd .sub{font-weight:400;color:var(--mut);font-size:12px}
.card>.bd{padding:16px}
.row{display:flex;align-items:center;gap:8px}.gap16{gap:16px}.wrap{flex-wrap:wrap}.sp{margin-left:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) 340px}
.pagehd{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.pagehd h2{font-size:22px;font-weight:700;letter-spacing:-.2px}
.pagehd p{color:var(--mut);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--panel3)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:#2f6fe0}
.btn.dng{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.dis{opacity:.5;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.b-green{background:var(--green-bg);color:var(--green);border-color:rgba(52,211,153,.35)}
.b-red{background:var(--red-bg);color:var(--red-t);border-color:rgba(239,68,68,.45)}
.b-orange{background:var(--orange-bg);color:var(--orange);border-color:rgba(251,146,60,.4)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(250,204,21,.35)}
.b-gray{background:var(--gray-bg);color:#475467;border-color:rgba(100,116,139,.4)}
.b-blue{background:var(--blue-bg);color:var(--blue-t);border-color:rgba(59,130,246,.45)}
.sd{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.sd.sq{border-radius:2px}.sd.tri{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}.sd.ring{background:transparent;border:2px solid currentColor}
.pulse{animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}
@media (prefers-reduced-motion:reduce){.pulse,.blink{animation:none!important}}
.blink{animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.35}}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mut);font-weight:600;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{padding:8px 16px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-weight:500;margin-bottom:-1px;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--tx)}.tab.on{color:var(--blue-t);border-color:var(--blue)}
.tab .n{background:var(--panel3);border-radius:10px;padding:0 8px;font-size:11px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);border:0;padding:6px 12px;color:var(--mut);font-weight:500;border-right:1px solid var(--line2);display:flex;gap:6px;align-items:center}
.seg button:last-child{border:0}.seg button.on{background:var(--blue-bg);color:var(--blue-t);box-shadow:inset 0 -2px 0 var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.fld{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;min-width:130px}
label.l{display:block;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:500}
.chk{display:flex;align-items:center;gap:8px;padding:8px 0}
.chk input{width:16px;height:16px;accent-color:var(--blue)}
.kpi{padding:16px}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .k{color:var(--mut);font-size:12px;font-weight:500;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.kpi .s{font-size:12px;margin-top:8px;display:flex;gap:8px;align-items:center}
.kpi.hot{border-color:rgba(239,68,68,.55);background:linear-gradient(180deg,rgba(239,68,68,.12),var(--panel))}
/* video */
.tile{position:relative;background:#05080c;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/9}
.tile.det{border:2px solid var(--red);box-shadow:0 0 0 3px rgba(239,68,68,.2)}
.tile svg.sc{position:absolute;inset:0;width:100%;height:100%}
.tile .ov{position:absolute;left:0;right:0;padding:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.tile .ov.t{top:0;background:linear-gradient(#000a,transparent)}
.tile .ov.b{bottom:0;background:linear-gradient(transparent,#000c);align-items:center}
.tile .ov *{pointer-events:auto}
.tile .nm{font-weight:600;font-size:12px;text-shadow:0 1px 2px #000}
.tile .lc{font-size:11px;color:#cfd8e4}
.tile .ib{background:#000a;border:1px solid #fff3;border-radius:6px;width:26px;height:26px;display:grid;place-items:center;color:#fff}
.tile .ib:hover{background:#000d}
.tile .ib svg{width:14px;height:14px}
.tile .off{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(45deg,#0b1017,#0b1017 10px,#0e141c 10px,#0e141c 20px);color:var(--mut)}
.chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;background:#000b;display:inline-flex;gap:6px;align-items:center;border:1px solid #fff2}
.chip.red{background:var(--red);border-color:var(--red);color:#fff}
.rec{width:8px;height:8px;border-radius:50%;background:var(--red)}
/* alert card */
.al{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);border-left:4px solid var(--gray)}
.al.crit{border-left-color:var(--red);background:linear-gradient(90deg,rgba(239,68,68,.1),var(--panel2) 60%)}
.al.warn{border-left-color:var(--orange)}.al.attn{border-left-color:var(--yellow)}
.al h4{font-size:14px;font-weight:600}
.al .meta{color:var(--mut);font-size:12px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0 8px}
.al .meta span{display:inline-flex;gap:4px;align-items:center}
.thumb{width:84px;height:56px;border-radius:6px;overflow:hidden;position:relative;flex:none;border:1px solid var(--line)}
.thumb svg{width:100%;height:100%;display:block}
/* map */
.mapwrap{position:relative;background:var(--map);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.mapwrap svg.fp{width:100%;display:block}
.mk{cursor:pointer}.mk:focus-visible{outline:none}.mk:focus-visible circle.hit{stroke:#fff;stroke-width:2}
.pop{position:absolute;left:16px;bottom:16px;width:300px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 32px #1a2b4a33;padding:12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;gap:6px;align-items:center}
/* timeline */
.tl{position:relative;padding-left:24px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl li{list-style:none;position:relative;padding-bottom:16px}
.tl li:before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--blue)}
.tl li.r:before{border-color:var(--red);background:var(--red)}.tl li.g:before{border-color:var(--green);background:var(--green)}.tl li.o:before{border-color:var(--orange)}
.tl li.pend{opacity:.55}.tl li.pend:before{border-style:dashed}
.tl b{font-weight:600}.tl small{display:block;color:var(--mut)}
/* chain */
.chain{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.node{border:1px solid var(--line2);background:var(--panel2);border-radius:8px;padding:10px 12px;min-width:132px}
.node small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.arrow{align-self:center;color:var(--dim);padding:0 6px}
.stepper{display:flex;gap:0;margin-bottom:24px}
.stp{flex:1;display:flex;align-items:center;gap:8px;color:var(--mut);font-weight:500;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.stp .no{width:26px;height:26px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--panel)}
.stp.on{color:var(--tx)}.stp.on .no{border-color:var(--blue);background:var(--blue)}
.stp.done .no{border-color:var(--green);color:var(--green)}
.stp:after{content:"";flex:1;height:2px;background:var(--line);margin:0 12px}.stp:last-child:after{display:none}
.opt{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;width:100%;text-align:left}
.opt:hover{border-color:var(--line2)}.opt.on{border-color:var(--blue);background:var(--blue-bg)}
.opt .rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:none}.opt.on .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 45%,transparent 50%)}
/* model builder */
.blk{border:1px solid var(--line2);border-radius:10px;background:var(--panel2);padding:16px;position:relative}
.blk>.tag{position:absolute;top:-10px;left:12px;background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:1px 10px;border-radius:5px;letter-spacing:.8px}
.blk.then>.tag{background:var(--green);color:#04210f}
.cond{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.cond .op{font-size:11px;font-weight:700;color:var(--blue-t);width:36px}
.pill{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;display:inline-flex;gap:8px;align-items:center}
.conn{width:2px;height:16px;background:var(--line2);margin:0 auto}
/* modal/drawer/toast */
.scrim{position:fixed;inset:0;background:#0f1a2b88;z-index:50;display:flex;justify-content:center;padding-top:12vh}
.modal{width:600px;max-width:92vw;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 24px 64px #1a2b4a55;height:fit-content}
.drawer{position:fixed;top:0;right:0;bottom:0;width:420px;background:var(--panel);border-left:1px solid var(--line2);z-index:51;overflow:auto;box-shadow:-12px 0 32px #0008}
#toasts{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;gap:8px;width:380px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--blue);border-radius:8px;padding:12px;box-shadow:0 12px 32px #1a2b4a33;display:flex;gap:12px}
.toast.crit{border-left-color:var(--red);border-color:var(--red)}.toast.ok{border-left-color:var(--green)}.toast.warn{border-left-color:var(--orange)}
.sres{padding:8px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;border-radius:6px}.sres:hover{background:var(--panel2)}
.sgrp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);padding:12px 16px 4px;font-weight:600}
.empty{text-align:center;padding:32px 24px}
.empty .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--panel3)}
.empty .ic svg{width:28px;height:28px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:8px;border:1px solid}
.vol{height:6px;background:var(--panel3);border-radius:3px;width:100px;overflow:hidden}.vol i{display:block;height:100%;background:var(--blue)}
.tree{list-style:none;padding-left:0}.tree ul{list-style:none;padding-left:20px;border-left:1px dashed var(--line2);margin-left:10px}
.tree li>.n{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}.tree li>.n:hover{background:var(--panel2)}.tree li>.n.on{background:var(--blue-bg)}
dl.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px}dl.kv dt{color:var(--mut)}dl.kv dd{font-weight:500}
.sw{width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;border:0;flex:none}.sw:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--blue)}.sw.on:after{left:18px}
.perm{text-align:center}
.login{display:grid;grid-template-columns:1.1fr 1fr;height:100vh}
.login>.l{background:radial-gradient(circle at 30% 20%,#12315e,#0a0e13 60%);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login>.l{color:#fff}.login>.l .mut{color:#b6c3d6}.login>.l .badge{background:rgba(52,211,153,.15);color:#6ee7b7}.login .r{display:grid;place-items:center;background:var(--panel)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
@media (max-width:1300px){.g6{grid-template-columns:repeat(3,1fr)}.g-main{grid-template-columns:1fr}}

/* ===== polish: calm, roomy, consistent ===== */
:root{--sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);--r:12px}
body{font-size:14px;line-height:1.5;letter-spacing:-.005em}
#app{grid-template-columns:240px 1fr}
aside{padding:24px 16px;background:#fff}
.brand{padding:0 8px 24px}
nav a{padding:10px 12px;margin-bottom:4px;border-radius:10px;font-weight:500}
nav a.on:before{display:none}
nav a.on{background:var(--blue-bg)}
nav .cnt{background:var(--red);font-size:11px}
header.top{background:transparent;border:0;padding:20px 32px 0}
header.top h1{display:none}
.search{margin-left:0;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);border-radius:10px;padding:10px 14px;max-width:440px}
.search kbd{border:0;background:var(--panel3);color:var(--mut)}
select.jump{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--mut);max-width:180px}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.sys{display:none}
#content{padding:24px 32px 48px;max-width:1560px}
.card{border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card>.hd{padding:16px 20px;border-bottom:1px solid var(--line);font-size:15px}
.card>.bd{padding:20px}
.pagehd{margin-bottom:24px}
.pagehd h2{font-size:24px}
.pagehd p{color:var(--mut);font-size:14px}
.grid{gap:24px}.grid.g6{gap:16px}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:#fff;font-weight:500;box-shadow:var(--sh)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:none}.btn.pri:hover{background:#1d4ed8}
.btn.dng{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}.btn.ghost:hover{background:var(--panel3)}
.btn.sm{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.badge{border:0;font-weight:500;padding:3px 10px;border-radius:999px}

/* ===== 3D site-plan map ===== */
.mapwrap{background:linear-gradient(#e9eef8,#dde5f3)!important;border:1px solid var(--glass-b);overflow:hidden}
.stage3d{position:relative;width:100%;aspect-ratio:1.62/1;min-height:320px;perspective:1500px;perspective-origin:50% 0%;background-image:linear-gradient(rgba(120,140,180,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(120,140,180,.12) 1px,transparent 1px);background-size:34px 34px;--ps:1}
.plane3d{position:absolute;left:2%;right:2%;top:2%;aspect-ratio:800/470;transform-origin:50% 100%;transform:rotateX(34deg);border-radius:12px;box-shadow:0 34px 44px -18px rgba(25,45,90,.4),0 0 0 1px rgba(150,165,195,.5);background:#fdfcfa}
.plane3d svg.fp{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:12px}
.plane3d .anc{position:absolute;width:1px;height:1px}
.pins3d{position:absolute;inset:0;pointer-events:none}
.pin3d{position:absolute;pointer-events:auto;transform:translate(-50%,-100%);background:none;border:0;padding:0;display:block;width:calc(34px*var(--ps));cursor:pointer}
.pin3d .head{display:grid;place-items:center;width:calc(34px*var(--ps));height:calc(34px*var(--ps));border-radius:50%;background:#fff;border:calc(3px*var(--ps)) solid var(--pc);box-shadow:0 3px 8px rgba(20,35,70,.3);position:relative;transition:transform .12s}
.pin3d:hover .head,.pin3d.sel .head{transform:scale(1.18)}
.pin3d.sel .head{box-shadow:0 0 0 4px rgba(61,90,254,.35),0 3px 8px rgba(20,35,70,.3)}
.pin3d svg{width:calc(18px*var(--ps));height:calc(18px*var(--ps));fill:none;stroke:var(--pc);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin3d.off .head{border-style:dashed}.pin3d .head s{position:absolute;left:12%;right:12%;top:48%;height:3px;background:#8b95a8;transform:rotate(-45deg);border-radius:2px}
.pin3d .stem{display:block;width:calc(3px*var(--ps));height:calc(13px*var(--ps));background:var(--pc);margin:-1px auto 0;border-radius:0 0 2px 2px}
.pin3d .bdg{position:absolute;top:calc(-6px*var(--ps));right:calc(-6px*var(--ps));min-width:calc(18px*var(--ps));height:calc(18px*var(--ps));border-radius:999px;color:#fff;font:800 calc(10.5px*var(--ps)) Urbanist,sans-serif;display:grid;place-items:center;border:2px solid #fff;padding:0 3px;z-index:2}
.pin3d .lbl{position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);font:600 calc(10px*var(--ps)) var(--mono);background:#fff;border:1px solid #d6dce8;border-radius:999px;padding:1px 7px;color:#2a3550;white-space:nowrap;font-style:normal;box-shadow:0 1px 3px rgba(20,35,70,.15)}
.pin3d.bz .head{border-radius:30%;width:calc(26px*var(--ps));height:calc(26px*var(--ps));margin:0 auto}
.pin3d.bz svg{width:calc(14px*var(--ps));height:calc(14px*var(--ps))}
.pin3d.bz .stem{height:calc(8px*var(--ps))}
.pin3d:focus-visible .head{outline:3px solid var(--blue-t);outline-offset:2px}
.pop{z-index:3000}

.fullmap{display:flex;flex-direction:column;height:min(780px,92vh)}
.fullmap .fmbody{flex:1;min-height:0;padding:0 24px}
.fullmap .fmbody .mapwrap{border-radius:22px}
.fullmap .stage3d{aspect-ratio:auto;height:100%;min-height:0}

.fullmap .fmfoot{flex:none;padding:14px 32px 20px}

.acform{max-width:none;margin:0;display:grid;gap:24px}

.acsec h4{font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);margin-bottom:14px}

.cdchip:hover{border-color:var(--ink)}
.cdchip.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:#fff;font-weight:700}

.bzc-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.bzc-row svg{color:var(--mut);flex:none}
.bzc-cams{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12.5px;padding-top:10px;border-top:1px solid var(--line)}
.bzc-cams em{font:600 11.5px var(--mono);font-style:normal;background:var(--panel3);border-radius:999px;padding:2px 9px}
.bzc-cams em.more2{background:var(--ink);color:#fff}
.bzc-warn{display:flex;align-items:center;gap:6px;background:#fde4e4;color:#b91c1c;border-radius:10px;padding:6px 10px;font-size:12.5px;font-weight:600}
.bzc-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bzc-id{display:flex;align-items:center;gap:8px;margin-top:3px}.bzc-id .badge{padding:1px 8px;font-size:11.5px}.gcard-own.bzc{width:290px!important}
/* restricted areas */
.rwrap{position:relative}
.rov{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.rlab{position:absolute;z-index:3;transform:translateY(-100%);background:#ef4444;color:#fff;font:700 10px/1 Urbanist,sans-serif;letter-spacing:.6px;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}
.rlayer{position:absolute;inset:0;z-index:7;cursor:crosshair;border-radius:12px;background:rgba(15,26,43,.15);outline:2px dashed #ffd400;outline-offset:-3px}
.rlayer svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#rdots .rdot{position:absolute;width:12px;height:12px;background:#ffd400;border:1.5px solid #7a5d00;box-sizing:border-box;transform:translate(-50%,-50%);pointer-events:none}
#rdots .rdot.last{box-shadow:0 0 0 4px rgba(255,212,0,.4)}
.rbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;padding:12px 16px;background:#fffbe6;border:1px solid #f1dd8a;border-radius:16px}
.rbar-t{display:flex;align-items:center;gap:10px;color:#7a5d00}.rbar-t b{color:var(--ink)}
.ric{width:32px;height:32px;border-radius:10px;background:#fde4e4;color:#b91c1c;display:grid;place-items:center;flex:none;margin-right:2px}

.rlab{display:inline-flex;align-items:center;gap:6px}
.rlab .rx{pointer-events:auto;cursor:pointer;display:inline-grid;place-items:center;width:16px;height:16px;padding:0;margin:-1px -3px -1px 0;border:0;border-radius:4px;background:rgba(255,255,255,.22);color:#fff}
.rlab .rx:hover{background:#fff;color:#b91c1c}

.amodal .amb label.l{margin-bottom:8px}.amodal .amb .card>.bd .grid.dform{gap:28px 20px!important}
/* model -> detections */
.mbox{border:1.5px solid #c9d0de;border-radius:14px;background:#fff;overflow:hidden}
.mbox.on{border-color:var(--ink)}
.mhead{display:flex;align-items:center;gap:12px;padding:10px 16px}
.mhead b{font-size:15px;font-weight:600}
.mdets{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 14px 44px}
.dchip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1.5px solid #c9d0de;border-radius:999px;background:#fff;cursor:pointer;font-size:13.5px}

.dchip em{font:500 11.5px var(--mono);font-style:normal;color:var(--mut)}

.thbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--mut)}

/* Sky Eye logo */
.brand .lg{background:#fff!important;border:1px solid var(--line);box-shadow:0 2px 8px rgba(30,60,120,.12);padding:3px;width:48px;height:48px;border-radius:14px;color:inherit}
.brand .lg img{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
.loginlogo{width:min(140px,40vw);height:auto;display:block;mix-blend-mode:multiply;margin-left:-8px}
.mbrand .mlogo{width:140px;height:auto;mix-blend-mode:multiply}
.mbrand{margin-bottom:12px}

/* account avatar (top right) */
.usermenu{position:relative}
.avbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-b);background:linear-gradient(135deg,#ffd9cc,#cfd8ff);box-shadow:var(--sh);font:700 13px Urbanist,sans-serif;color:var(--ink);display:grid;place-items:center;padding:0}

.umenu{position:absolute;right:0;top:calc(100% + 10px);width:280px;background:#fff;border:1px solid var(--glass-b);border-radius:18px;box-shadow:0 16px 40px rgba(20,35,70,.22);padding:8px;z-index:70}
.umenu[hidden]{display:none}
.um-top{display:flex;align-items:center;gap:12px;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}

.um-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:500}
.um-item:hover{background:var(--panel3)}
@media (max-width:560px){.umenu{width:min(280px,calc(100vw - 24px))}}

.permopt{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border:1.5px solid #c9d0de;border-radius:14px;background:#fff;cursor:pointer}
.permopt:has(input:checked){border-color:var(--ink);background:#f6f8fb}

.btn.pri{background:#14ABEE!important;border-color:#14ABEE!important;color:#fff;box-shadow:0 8px 18px rgba(20,171,238,.28)}.btn.pri:hover{background:#0f95d1!important;border-color:#0f95d1!important}.toast .btn.pri{background:#fff!important;border-color:#fff!important;color:var(--ink);box-shadow:none}

.lnk{border:0;background:none;color:#0f8bc4;font:600 14px Urbanist,sans-serif;padding:0;cursor:pointer}.lnk:hover{text-decoration:underline}.lnk.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:20px;color:var(--mut)}.lnk.back .i{transform:rotate(180deg)}

.okring{width:64px;height:64px;border-radius:50%;background:#dcf5ea;color:#047857;display:grid;place-items:center;margin:0 auto 16px}

.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none!important}

.loginform{background:rgba(255,255,255,.92);border:1px solid #fff;border-radius:28px;box-shadow:0 24px 60px rgba(40,70,130,.12);padding:40px 36px;width:min(460px,100%)}.loginform .fld{height:48px}.secnote{display:flex;gap:8px;align-items:flex-start;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)}.secnote .i{flex:none;margin-top:2px}@media(max-width:560px){.loginform{padding:28px 20px;border-radius:24px}}
.gis.ov{height:480px!important;min-height:0!important}.gis.fm{height:100%!important;min-height:0!important}@media(max-width:768px){.gis.ov{height:380px!important}}
.cphead{display:flex;gap:16px;align-items:flex-start;padding:28px 28px 20px}.cphead h3{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.2}.cphead p{font-size:14px;margin-top:4px}
.cpico{width:48px;height:48px;border-radius:16px;background:#e3f4fd;color:#0f8bc4;display:grid;place-items:center;flex:none}
.cpx{width:36px;height:36px;border-radius:50%;border:0;background:var(--panel3);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}.cpx:hover{background:#e3e8ef}
.cpbody{padding:0 28px 24px}.cpbody .l{display:block;margin-bottom:6px}.cpbody .fld{height:48px}.cphr{border:0;border-top:1px solid var(--line);margin:20px 0}
.cpm .pwm{margin-top:12px;padding:12px 14px;background:#f5f8fc;border-radius:14px}.cpm .pwrules{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:10px}.cpm .pwt{margin-top:8px}
.cpfoot{display:flex;justify-content:flex-end;gap:10px;padding:16px 28px 24px;border-top:1px solid var(--line)}.cpfoot .btn{height:44px;padding:0 22px}

const GIS0={lat:43.3600,lng:-5.1250,m:0.9};
const gisLL=(x,y)=>[GIS0.lat-(y-235)*GIS0.m/111320,GIS0.lng+(x-400)*GIS0.m/(111320*Math.cos(GIS0.lat*Math.PI/180))];
const gisXY=ll=>[(ll[1]-GIS0.lng)*111320*Math.cos(GIS0.lat*Math.PI/180),(ll[0]-GIS0.lat)*111320];
const gisArea=pts=>{const p=pts.map(gisXY);let a=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];a+=p[i][0]*q[1]-q[0]*p[i][1]}return Math.abs(a/2)};
const gisInside=(pt,poly)=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[yi,xi]=[poly[i][0],poly[i][1]],[yj,xj]=[poly[j][0],poly[j][1]];if((xi>pt[1])!==(xj>pt[1])&&pt[0]<(yj-yi)*(pt[1]-xi)/(xj-xi)+yi)c=!c}return c};
const gisRect=(x,y,w,h)=>[gisLL(x,y),gisLL(x+w,y),gisLL(x+w,y+h),gisLL(x,y+h)];

function gisParcels(){const R=(n=>()=>(n=(n*9301+49297)%233280)/233280)(77),X0=-560,Y0=-380,W=160,H=120,C=12,Rw=11;const vx=[];for(let r=0;r<=Rw;r++){vx[r]=[];for(let c=0;c<=C;c++)vx[r][c]=[X0+c*W+(R()-.5)*52,Y0+r*H+(R()-.5)*40]}
  const out=[];let n=1;const nums=Array.from({length:C*Rw},(_,i)=>i+1).sort(()=>R()-.5);

  const arcs=rows.map((r,i)=>{const a1=a0+r[1]/tot*2*Math.PI,R=70,x0=90+R*Math.cos(a0),y0=90+R*Math.sin(a0),x1=90+R*Math.cos(a1),y1=90+R*Math.sin(a1);const d=`M${x0} ${y0}A${R} ${R} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;a0=a1;return`<path d="${d}" stroke="${cs[i]}" stroke-width="22" fill="none"><title>${r[0]}: ${r[1]}</title></path>`}).join('');
  return`<div class="row gap16"><svg viewBox="0 0 180 180" width="180" role="img" aria-label="Detections by type">${arcs}<text x="90" y="88" text-anchor="middle" font-size="22" font-weight="700" fill="var(--tx)">${tot.toLocaleString()}</text><text x="90" y="106" text-anchor="middle" font-size="10" fill="var(--mut)">detections</text></svg><div style="flex:1">${rows.map((r,i)=>`<div class="row" style="padding:4px 0"><span style="width:10px;height:10px;border-radius:2px;background:${cs[i]}"></span>${r[0]}<b class="sp mono">${r[1]}</b><span class="dim" style="width:40px;text-align:right">${Math.round(r[1]/tot*100)}%</span></div>`).join('')}</div></div>`}
function line(vals,target){const w=560,h=160,mx=Math.max(...vals,target)*1.2,pts=vals.map((v,i)=>[30+i*(w-40)/(vals.length-1),h-v/mx*h+8]);
  return`<svg viewBox="0 0 ${w} ${h+24}" style="width:100%" role="img" aria-label="Response time line chart"><line x1="30" x2="${w}" y1="${h-target/mx*h+8}" y2="${h-target/mx*h+8}" stroke="#047857" stroke-dasharray="5 4"/><text x="34" y="${h-target/mx*h+2}" font-size="10" fill="#047857">Target ${target}s</text><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#0ea5e9" stroke-width="2.5"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#0ea5e9"><title>${vals[i]}s</title></circle>`).join('')}${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map((d,i)=>`<text x="${30+i*(w-40)/6}" y="${h+22}" text-anchor="middle" font-size="9" fill="var(--dim)">${d}</text>`).join('')}</svg>`}

function rStart(id){S.rDraw=id;S.rDraft=[];render();toast('Click on the video to add points. Double-click or press Enter to finish.','info')}
function rRedraw(){const g=document.getElementById('rdraft');if(!g)return;const p=S.rDraft;
  g.innerHTML=(p.length>=3?`<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="rgba(239,68,68,.22)" stroke="none"/>`:'')+(p.length>=2?`<polyline points="${p.map(q=>q.join(',')).join(' ')}${p.length>=3?' '+p[0].join(','):''}" fill="none" stroke="#ffd400" stroke-width="2" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/>`:'');

  const f=document.getElementById('rfinish');if(f)f.classList.toggle('dis',p.length<3)}
function rAdd(e){const r=e.currentTarget.getBoundingClientRect();S.rDraft.push([+((e.clientX-r.left)/r.width*100).toFixed(2),+((e.clientY-r.top)/r.height*100).toFixed(2)]);rRedraw()}
function rUndo(){S.rDraft.pop();rRedraw()}
function rCancel(){S.rDraw=null;S.rDraft=[];render()}
function rFinish(){if(S.rDraft.length<3){toast('Add at least 3 points to mark an area','warn');return}

function delItem(kind,id){
  const msg={cam:'This camera, its mapping and its detection settings will be removed. Past alerts and recordings are kept.',bzr:'Cameras mapped to this buzzer will no longer sound an alarm until they are mapped to another buzzer.',model:'This model will stop raising alerts immediately.',user:'They will be signed out and lose access immediately.',rec:'This clip will be permanently removed and cannot be recovered.',alarm:'This alarm will stop sounding the buzzer for this camera.'}[kind];
  confirmDlg(kind==='rec'?'Delete this recording?':`Delete ${LBL[kind]} “${id}”?`,msg,'Delete',`doDelete('${kind}','${id}')`)}
function doDelete(kind,id){
  if(kind==='cam'){const c=cam(id);if(c)c.del=true}
  else if(kind==='bzr'){const b=spk(id);if(b)b.del=true}
  else if(kind==='model'){const i=RULES.findIndex(r=>r[0]===id);if(i>-1)RULES.splice(i,1)}
  else if(kind==='user'){const i=USERS.findIndex(u=>u[0]===id);if(i>-1)USERS.splice(i,1)}
  else if(kind==='rec'){S.delRec.add(id)}
  else if(kind==='alarm'){const i=ALARM_CFG.findIndex(a=>a.id===id);if(i>-1)ALARM_CFG.splice(i,1)}
  toast(kind==='rec'?'Recording deleted':`${LBL[kind][0].toUpperCase()+LBL[kind].slice(1)} “${id}” deleted`,'ok');
  if(location.hash.split('/')[1]==='camera'||location.hash.split('/')[1]==='buzzer'||location.hash.split('/')[1]==='user')go({cam:'cameras',bzr:'buzzers',user:'users',rec:'recordings'}[kind]||'overview');
  render()}

function saveBuzzer(id){

S.pg={};
function paginate(key,list,sizes=[20,50,100]){
  const st=S.pg[key]||(S.pg[key]={page:1,size:sizes[0],sizes});
  st.total=list.length;const pages=Math.max(1,Math.ceil(list.length/st.size));st.page=Math.min(Math.max(1,st.page),pages);
  return list.slice((st.page-1)*st.size,st.page*st.size)}
function pgGo(k,p){S.pg[k].page=p;render()}
function pgSize(k,n){S.pg[k].size=n;S.pg[k].page=1;render()}
function pager(key,solo){
  const st=S.pg[key];if(!st||st.total<=20)return'';
  const pages=Math.max(1,Math.ceil(st.total/st.size)),p=st.page;
  const a=st.total?(p-1)*st.size+1:0,b=Math.min(st.total,p*st.size);
  let nums=[];if(pages<=7)nums=Array.from({length:pages},(_,i)=>i+1);else{nums=[1];if(p>3)nums.push('…');for(let i=Math.max(2,p-1);i<=Math.min(pages-1,p+1);i++)nums.push(i);if(p<pages-2)nums.push('…');nums.push(pages)}
  return`<div role="navigation" class="pager ${solo?'solo':''}" aria-label="Pagination"><span class="mut">Showing <b style="color:var(--ink)">${a}–${b}</b> of <b style="color:var(--ink)">${st.total}</b></span><span class="sp row" style="gap:6px"><label class="mut" for="pgs-${key}" style="margin-right:4px">Rows per page</label><select id="pgs-${key}" class="fld pgsel" onchange="pgSize('${key}',+this.value)">${st.sizes.map(n=>`<option ${n===st.size?'selected':''}>${n}</option>`).join('')}</select>
  <button class="pgb" aria-label="Previous page" ${p<=1?'disabled':''} onclick="pgGo('${key}',${p-1})">${ic('chev').replace('<path','<path transform="rotate(180 12 12)"')}</button>
  ${nums.map(n=>n==='…'?'<span class="mut" style="padding:0 4px">…</span>':`<button class="pgb ${n===p?'on':''}" ${n===p?'aria-current="page"':''} aria-label="Page ${n}" onclick="pgGo('${key}',${n})">${n}</button>`).join('')}
  <button class="pgb" aria-label="Next page" ${p>=pages?'disabled':''} onclick="pgGo('${key}',${p+1})">${ic('chev')}</button></span></div>`}

function roleFrom(n){const r=ROLES.find(x=>x[0]===n);PERM.forEach((_,i)=>{const v=r?r[2][i]:0;const e=document.querySelector(`input[name=rp${i}][value="${v}"]`);if(e)e.checked=true})}
function saveRole(orig){

  const dup=ROLES.some(x=>x[0]!==orig&&x[0].toLowerCase()===name.toLowerCase());
  const eN=g('rl-e-name');eN.style.display=(!name||dup)?'inline-flex':'none';eN.lastElementChild.textContent=dup?'A role with this name already exists':'Enter a role name';
  const noPerm=!perms.some(Boolean);g('rl-e-perm').style.display=noPerm?'inline-flex':'none';
  if(!name||dup){g('rl-name').focus();return}if(noPerm)return;
  if(orig){const r=ROLES.find(x=>x[0]===orig);USERS.forEach(u=>{if(u[2]===orig)u[2]=name});r[0]=name;r[1]=desc||'Custom role';r[2]=perms;closeOv();toast(`Role “${name}” updated`,'ok')}
  else{ROLES.push([name,desc||'Custom role',perms]);closeOv();toast(`Role “${name}” added`,'ok')}
  render()}
function delRole(n){const c=userRoleCount(n);if(c){toast(`${c} user${c>1?'s':''} still ${c>1?'have':'has'} the “${n}” role. Reassign them first.`,'warn');return}

const pwRules=v=>[['At least 8 characters',v.length>=8],['An uppercase letter',/[A-Z]/.test(v)],['A lowercase letter',/[a-z]/.test(v)],['A number',/\d/.test(v)],['A symbol (e.g. ! @ #)',/[^A-Za-z0-9]/.test(v)]];
const pwStrength=v=>{const n=pwRules(v).filter(x=>x[1]).length;return !v?[0,'']:n<=2?[1,'Weak']:n<=4?[2,'Fair']:[3,'Strong']};
const pwMeterHTML=(v,id)=>{const[s,t]=pwStrength(v),c=['','#dc2626','#d97706','#16a34a'][s];return`<div id="${id}" class="pwm"><div class="pwbar">${[1,2,3].map(i=>`<i style="background:${i<=s?c:'#e3e8ef'}"></i>`).join('')}</div><div class="pwrules">${pwRules(v).map(r=>`<span class="${r[1]?'ok':''}">${ic(r[1]?'check':'x',12)}${r[0]}</span>`).join('')}</div>${t?`<div class="pwt" style="color:${c}">${t} password</div>`:''}</div>`};
const pwMeter=(inp,id)=>{const m=document.getElementById(id);if(m)m.outerHTML=pwMeterHTML(document.getElementById(inp).value,id)};
const pwField=(id,label,o={})=>`<label class="l" for="${id}">${label}${o.req===false?'':' <span class="req">*</span>'}</label><div class="pwwrap"><input id="${id}" type="password" class="fld" style="width:100%" autocomplete="${o.ac||'off'}" placeholder="${o.ph||''}" value="${o.val||''}" ${o.oninput?`oninput="${o.oninput}"`:''}><button type="button" class="pwtog" aria-label="Show password" aria-pressed="false" onclick="pwToggle('${id}',this)">${ic('eye',20)}</button></div><div id="${id}-e" class="badge b-red acerr">${ic('alert',12)}<span></span></div>`;
function pwToggle(id,b){const i=document.getElementById(id),show=i.type==='password';i.type=show?'text':'password';b.innerHTML=ic(show?'eyeoff':'eye',20);b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Hide password':'Show password')}
function fErr(id,msg){const e=document.getElementById(id+'-e');if(!e)return !!msg;e.style.display=msg?'inline-flex':'none';if(msg)e.lastElementChild.textContent=msg;const i=document.getElementById(id);i&&i.setAttribute('aria-invalid',!!msg);return !!msg}
function authGo(step){S.auth=step;render();setTimeout(()=>{const f=document.querySelector('.loginform input:not([type=checkbox]),.loginform .otp input');f&&f.focus()},30)}
const maskId=(id,m)=>m==='phone'?id.replace(/\d(?=\d{2})/g,'•'):id.replace(/^(.).*(@.*)$/,'$1•••$2');
function idField(){return false
 ?`<label class="l" for="ph">Phone number</label><div class="row" style="gap:8px"><select class="fld" aria-label="Country code" style="width:96px;flex:none"><option>+1</option><option>+44</option><option>+91</option><option>+61</option><option>+971</option></select><input id="ph" type="tel" inputmode="tel" class="fld" style="flex:1;min-width:0" placeholder="555 010 2030" value="${S.auth==='forgot'?'':'555 010 2030'}" autocomplete="tel-national"></div><div id="ph-e" class="badge b-red acerr" style="margin-bottom:0">${ic('alert',12)}<span></span></div>`
 :`<label class="l" for="em">Email address</label><input id="em" type="email" inputmode="email" class="fld" style="width:100%" placeholder="you@company.com" value="${S.auth==='forgot'?'':'m.torres@factory.example'}" autocomplete="email"><div id="em-e" class="badge b-red acerr">${ic('alert',12)}<span></span></div>`}
const idSeg=()=>'';const idSegOld=()=>`<div class="seg" role="group" aria-label="Use" style="margin-bottom:16px;width:100%"><button type="button" class="${S.loginMode!=='phone'?'on':''}" aria-pressed="${S.loginMode!=='phone'}" style="flex:1;justify-content:center" onclick="S.loginMode='email';render()">Email</button><button type="button" class="${S.loginMode==='phone'?'on':''}" aria-pressed="${S.loginMode==='phone'}" style="flex:1;justify-content:center" onclick="S.loginMode='phone';render()">Phone number</button></div>`;
function readId(){const ph=false,el=document.getElementById(ph?'ph':'em'),v=el.value.trim();let m='';
 if(!v)m=ph?'Enter your phone number':'Enter your email address';else if(ph&&v.replace(/\D/g,'').length<7)m='Enter a valid phone number';else if(!ph&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))m='Enter a valid email address';
 fErr(ph?'ph':'em',m);if(m){el.focus();return null}return v}
function doSignin(e){e.preventDefault();const id=readId();if(id===null)return;const pw=document.getElementById('pw').value;
 if(fErr('pw',pw?'':'Enter your password')){document.getElementById('pw').focus();return}
 const known=USERS.some(u=>u[1].toLowerCase()===id.toLowerCase());
 if(!known||pw!==AUTH.pw){const b=document.getElementById('autherr');b.style.display='flex';document.getElementById('pw').select();return}

function resendCode(){AUTH.t=30;toast('A new code was sent','ok');const el=document.getElementById('resend');el.textContent='Resend code in 0:30';authTick()}
function otpIn(i,e){const t=e.target;t.value=t.value.replace(/\D/g,'').slice(-1);const all=[...document.querySelectorAll('.otp input')];if(t.value&&all[i+1])all[i+1].focus();fErr('otp','')}
function otpKey(i,e){const all=[...document.querySelectorAll('.otp input')];if(e.key==='Backspace'&&!e.target.value&&all[i-1]){all[i-1].focus()}else if(e.key==='ArrowLeft'&&all[i-1])all[i-1].focus();else if(e.key==='ArrowRight'&&all[i+1])all[i+1].focus()}
function otpPaste(e){const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(!d)return;e.preventDefault();[...document.querySelectorAll('.otp input')].forEach((x,i)=>x.value=d[i]||'');document.querySelectorAll('.otp input')[Math.min(d.length,5)].focus()}
function verifyCode(e){e.preventDefault();const c=[...document.querySelectorAll('.otp input')].map(x=>x.value).join('');
 if(c.length<6){fErr('otp','Enter the 6-digit code');return}if(c!=='482913'){fErr('otp','That code is incorrect. Check it and try again.');return}clearInterval(AUTH.iv);authGo('reset')}
function setNewPw(e){e.preventDefault();const n=document.getElementById('np').value,c=document.getElementById('cp').value;
 const bad=[fErr('np',!n?'Enter a new password':pwRules(n).some(r=>!r[1])?'Password does not meet all the requirements':n===AUTH.pw?'Choose a password you have not used before':''),fErr('cp',n&&c!==n?'Passwords do not match':!c?'Confirm your new password':'')];
 if(bad.some(Boolean)){document.getElementById(bad[0]?'np':'cp').focus();return}AUTH.pw=n;authGo('done')}
function authView(){const st=S.auth||'signin';
 const back=`<button type="button" class="lnk back" onclick="clearInterval(AUTH.iv);authGo('signin')">${ic('chev')}Back to sign in</button>`;

 <div class="banner" style="margin:16px 0;border-color:var(--line);background:var(--panel2);font-size:12.5px;color:var(--mut)">${ic('shield')}Prototype: use code 482913</div>

 if(st==='reset')return`<form class="loginform" onsubmit="setNewPw(event)" novalidate>${head('Set a new password','Choose a strong password you do not use anywhere else.')}${pwField('np','New password',{ac:'new-password',oninput:"pwMeter('np','npm')"})}${pwMeterHTML('','npm')}<div style="height:16px"></div>${pwField('cp','Confirm new password',{ac:'new-password'})}<button class="btn pri" style="width:100%;justify-content:center;padding:10px;margin-top:24px">Update password</button></form>`;

 ${idSeg()}${idField()}<div style="height:16px"></div>${pwField('pw','Password',{ac:'current-password',val:AUTH.pw})}
 <div class="row" style="margin:12px 0 24px"><label class="chk" style="padding:0"><input type="checkbox" checked>Keep me signed in</label><button type="button" class="lnk sp" onclick="authGo('forgot')">Forgot password?</button></div>
 <button id="sibtn" class="btn pri" style="width:100%;justify-content:center;padding:12px;height:48px;font-size:16px">Sign in</button>

  const bad=[fErr('cur',!c?'Enter your current password':c!==AUTH.pw?'Current password is incorrect':''),fErr('npw',!n?'Enter a new password':pwRules(n).some(r=>!r[1])?'Password does not meet all the requirements':n===c?'New password must be different from the current one':''),fErr('cnf',!f?'Confirm your new password':n&&f!==n?'Passwords do not match':'')];

function saveAlarmCfg(id){
  const g=x=>document.getElementById(x),bzr=g('ac-bzr').value,cm=g('ac-cam').value,st=g('ac-start').value,en=g('ac-end').value,cdv=g('ac-cd').value;
  const show=(k,bad)=>{g('ac-e-'+k).style.display=bad?'inline-flex':'none';return bad};
  const bad=[show('bzr',!bzr),show('cam',!cm),show('time',!st||!en||en<=st),show('cd',cdv===''||+cdv<0||+cdv>600||!Number.isInteger(+cdv))].some(Boolean);
  if(bad){const first=[!bzr&&'ac-bzr',!cm&&'ac-cam',(!st||!en||en<=st)&&'ac-end','ac-cd'].find(Boolean);g(first).focus();return}
  const on=g('ac-on').classList.contains('on'),cfg={bzr,cam:cm,start:st,end:en,cd:+cdv,on};
  if(id){Object.assign(ALARM_CFG.find(a=>a.id===id),cfg);toast('Buzzer alarm updated','ok')}
  else{ALARM_CFG.unshift({id:nextAlarmId(),...cfg});toast('Buzzer alarm added','ok')}
  closeOv();render()}
